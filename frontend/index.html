<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-4">Student Management</h1>

    <!-- ===== Form ===== -->
    <h3 id="form-title">Add Student</h3>

    <form id="student-form">
        <label>Name</label>
        <input type="text" id="name" class="form-control mb-2" required>

        <label>Age (18-30)</label>
        <input type="number" id="age" class="form-control mb-2" required>

        <label>Email</label>
        <input type="email" id="email" class="form-control mb-2" required>

        <label>Roll</label>
        <input type="number" id="roll" class="form-control mb-2" required>

        <label>Session</label>
        <input type="text" id="session" class="form-control mb-2" required>

        <label>English Marks</label>
        <input type="number" id="english" class="form-control mb-2">

        <label>Math Marks</label>
        <input type="number" id="math" class="form-control mb-2">

        <label>History Marks</label>
        <input type="number" id="history" class="form-control mb-3">

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <!-- ===== Table ===== -->
    <h3 class="mt-5">All Students</h3>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Session</th>
                <th>English</th>
                <th>Math</th>
                <th>History</th>
                <th>Average</th>
                <th>Comment</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="student-table"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
