<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- Bootstrap CSS (loaded from the internet) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Our own small styles -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="bg-light">

    <!-- ===== Top navigation bar ===== -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">🎓 Student Management</span>
            <a class="btn btn-outline-light btn-sm" href="http://127.0.0.1:8000/docs" target="_blank">API Docs</a>
        </div>
    </nav>

    <div class="container">

        <!-- ===== Message (success / error) ===== -->
        <div id="message" class="alert d-none" role="alert"></div>

        <!-- ===== Student Add / Edit Form ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0" id="form-title">Add New Student</h5>
            </div>
            <div class="card-body">
                <form id="student-form">
                    <!-- row = one line, col-md-3 = 4 boxes per line (12 / 3 = 4) -->
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Rahim" required>
                        </div>
                        <div class="col-md-3">
                            <label for="age" class="form-label">Age (18-30)</label>
                            <input type="number" class="form-control" id="age" placeholder="e.g. 20" min="18" max="30" required>
                        </div>
                        <div class="col-md-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="e.g. rahim@gmail.com" required>
                        </div>
                        <div class="col-md-3">
                            <label for="roll" class="form-label">Roll</label>
                            <input type="number" class="form-control" id="roll" placeholder="e.g. 101" required>
                        </div>

                        <div class="col-md-3">
                            <label for="session" class="form-label">Session</label>
                            <input type="text" class="form-control" id="session" placeholder="e.g. 2024-25" required>
                        </div>
                        <div class="col-md-3">
                            <label for="english" class="form-label">English Marks (0-100)</label>
                            <input type="number" class="form-control" id="english" placeholder="e.g. 85" min="0" max="100">
                        </div>
                        <div class="col-md-3">
                            <label for="math" class="form-label">Math Marks (0-100)</label>
                            <input type="number" class="form-control" id="math" placeholder="e.g. 90" min="0" max="100">
                        </div>
                        <div class="col-md-3">
                            <label for="history" class="form-label">History Marks (0-100)</label>
                            <input type="number" class="form-control" id="history" placeholder="e.g. 78" min="0" max="100">
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Add Student</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancel-btn" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== Student List Table ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">All Students</h5>
                <span class="badge bg-primary" id="total">0 students</span>
            </div>
            <div class="card-body p-0">
                <!-- table-responsive = table scrolls on small screens -->
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Roll</th><th>Name</th><th>Age</th><th>Email</th><th>Session</th>
                                <th>English</th><th>Math</th><th>History</th>
                                <th>Average</th><th>Comment</th><th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="student-table">
                            <!-- JavaScript will add the rows here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Our JavaScript -->
    <script src="script.js?v=3"></script>
</body>
</html>
